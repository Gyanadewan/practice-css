<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid layout</title>
</head>
<style>
    #container{
    display: grid;
    grid-template-columns:repeat(4,6fr);
    gap:5px;
    }

    .box{
        color:blue;
        background-color: aqua;
        padding: 10px;
        font-size: 20px;
    }
</style>
<body>
      <div id="container">
        <div class="box">user-1</div>
        <div class="box">user-2</div>
        <div class="box">user-3</div>
        <div class="box">user-4</div>
        <div class="box">user-5</div>
        <div class="box">user-6</div>
        <div class="box">user-7</div>
        <div class="box">user-8</div>
        <div class="box">user-9</div>
        <div class="box">user-10</div>
        <div class="box">user-11</div>
        <div class="box">user-12</div>
        <div class="box">user-13</div>
      </div>
</body>
</html>
